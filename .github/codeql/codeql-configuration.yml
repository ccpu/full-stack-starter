name: CodeQL Configuration

paths:
  - api/*/src
  - packages/*/src
  - apps/*/src

paths-ignore:
  - test
  - 'test/**'
  - '**/__tests__/**'
  - '**/*.test.ts'
  - '*.spec.ts'
  - '**/*.min.js'
  - 'dist/**'
  - 'build/**'
  - 'coverage/**'
  - '*.md'
  - '*.txt'
  - '*.pdf'
  - '*.png'
  - '*.jpg'
  - '*.ico'

query-filters:
  # Falls over on our dynamic RegExp generation
  - exclude:
      id: js/regex-injection
